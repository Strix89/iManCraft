[workspace]
members = ["crates/core", "app", "cli"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"

[profile.release]
strip = true

# Le dipendenze si compilano ottimizzate anche in debug: decodifica immagini/AES troppo lente altrimenti.
[profile.dev.package."*"]
opt-level = 2
